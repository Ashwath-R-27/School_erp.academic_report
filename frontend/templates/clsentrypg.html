<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024, user-scalable=yes">
    <title>HSC(+2) Class Details</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
    <style>
        body {
            margin: 0;
            background-color: rgb(255, 255, 255);
        }

        #pghead{
            margin-top: 30px;
            padding: 10px 0;
            text-align: center;
            background-color: #005f5f;
            color: white;
            font-weight: bold;
            word-spacing: 3px;
            font-size: clamp(15px,4vw,20px);
        }

        .content {
            flex: 1;
            display: grid;
            place-items: center;
            padding: clamp(10px, 4vw, 20px);
        }

        .class-dtls-tbl {
            width: 95%;
        }

        .class-dtls-tbl table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #2c3e50;
        }

        .class-dtls-tbl table thead tr {
            background: #2c3e50;
        }

        .class-dtls-tbl table th {
            color: #f0f0f0;
            padding: 11px 16px;
            text-align: center;
            font-size: clamp(9px,4vw,15px);
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            border: 1px solid #46627a;
        }

        .class-dtls-tbl table th:first-child{
            width: 28%;
        }

        .class-dtls-tbl table tbody tr:nth-child(even) {
            background: #f4f6f8;
        }

        .class-dtls-tbl table tbody tr:nth-child(odd) {
            background: #ffffff;
        }

        .class-dtls-tbl table tbody tr:hover {
            background: #f4f9ff;
        }

        .class-dtls-tbl table td {
            padding: 10px 16px;
            border: 1px solid #c5cdd6;
            height: 35px;
            font-size: clamp(9px,4vw,15px);
            text-align: center;
            vertical-align: middle;
            font-weight: bold;
        }

        .class-dtls-tbl table td:first-child {
            text-align: center;
            padding: 0 10px;
        }

        /* --- group checkboxes (3 per row) --- */
        .group-checks {
            display: flex;
            align-items: center;
            justify-content: left;
            gap: clamp(8px, 3vw, 22px);
            flex-wrap: wrap;
        }

        .group-check-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: clamp(8px,3vw,13px);
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            white-space: nowrap;
        }

        .group-check-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #005f5f;
            cursor: pointer;
        }

        .remove-row-btn {
            background: none;
            border: 1px solid #c0392b;
            color: #c0392b;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 90%;
            transition: background 0.15s, color 0.15s;
        }

        .remove-row-btn:hover {
            background: #c0392b;
            color: #fff;
        }

        /* --- add row button --- */
        .action-row {
            margin: 18px 0;
            display: flex;
            justify-content: center;
        }

        .action-row button {
            padding: 9px 24px;
            background: #ffffff;
            color: #005f5f;
            border: 2px solid #005f5f;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .action-row button:hover {
            background: #005f5f;
            color: #fff;
        }

        .submit-wrap{
            margin-top: 4px;
        }

        .submit-wrap button{
            padding: 10px 24px;
            background-color: #d4a017;
            color: white;
            border: 1px solid #b08010;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.15s;
        }

        .submit-wrap button:hover {
            background: #b08010;
        }

        /* --- preview / review section --- */
        .preview-section {
            width: 95%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        #pghead2 {
            width: 100%;
            padding: 9px 0;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            font-weight: bold;
            letter-spacing: 0.05em;
            border-radius: 6px;
            font-size: clamp(13px,4vw,17px);
        }

        .preview-actions {
            display: flex;
            gap: 16px;
            margin-top: 4px;
        }

        .btn-secondary {
            padding: 10px 24px;
            background: #ffffff;
            color: #005f5f;
            border: 2px solid #005f5f;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .btn-secondary:hover {
            background: #005f5f;
            color: #fff;
        }

        .btn-primary {
            padding: 10px 24px;
            background-color: #d4a017;
            color: white;
            border: 1px solid #b08010;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-primary:hover {
            background: #b08010;
        }

        .btn-secondary:disabled,
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .section-input {
            width: 40%;
            padding: 5px 8px;
            border: 1px solid #9aa5b0;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            background: #f4f6f8;
            outline: none;
        }

        .section-input:focus {
            outline: 0;
            box-shadow: 0px 0px 9px 0px rgba(48,186,178,0.5);
            border-color: #005f5f;
        }
    </style>
</head>
<body>
    {{ header_div | safe }}
    <div id="pghead">HSC CLASS DETAILS</div>
    <div class="content">

        <div class="class-dtls-tbl" id="cls_dtls">
            <table>
                <thead>
                    <tr><th>CLASS (Section)</th><th>Groups</th><th>Action</th></tr>
                </thead>
                <tbody id="cls_tbody"></tbody>
            </table>
        </div>

        <div class="action-row" id="add_row_wrap">
            <button type="button" onclick="addRow()">+ Add Class</button>
        </div>

        <div class="submit-wrap" id="submit_wrap">
            <button type="button" onclick="handleSubmit()">Submit</button>
        </div>

        <div class="preview-section" id="preview_section" style="display:none;">
            <div id="pghead2">REVIEW DETAILS</div>
            <div class="class-dtls-tbl" id="preview_table_wrap">
                <table>
                    <thead>
                        <tr><th>CLASS (Section)</th><th>Groups Selected</th></tr>
                    </thead>
                    <tbody id="preview_tbody"></tbody>
                </table>
            </div>
            <div class="preview-actions">
                <button type="button" class="btn-secondary" onclick="handleEdit()">Edit</button>
                <button type="button" class="btn-primary" onclick="handleFinalSubmit()">Final Submit</button>
            </div>
        </div>

    </div>
    {{ footer_div | safe }}
    <script src="{{ url_for('static',filename='hscclsscript.js') }}"></script>
</body>
</html>
